<!doctype html>
<!--
  JARVIS loading screen ("Vanguard", matching the interface).

  Opened straight from disk (file://) the instant JARVIS is asked to start, so
  something is on screen before either server exists. It polls the bridge and
  the interface, shows their real state, and hands over to the interface the
  moment both answer. Self-contained apart from an optional web font: with no
  network it falls back to the system font. ?preview=1 holds it part-way.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>J.A.R.V.I.S.</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --accent: #3fb6ff;
        --accent-2: #1f78ff;
        --core: #2a8cff;
        --hi: #a6e4ff;
        --ink: #e9f3ff;
        --ink-2: rgba(196, 216, 242, 0.74);
        --ink-3: rgba(148, 176, 214, 0.52);
        --edge: rgba(80, 160, 255, 0.2);
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #01050e;
        color: var(--ink);
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
      }

      /* backdrop */
      .bg {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(42vw 48vh at 50% 44%, rgba(42, 140, 255, 0.2), transparent 70%),
          radial-gradient(50vw 30vh at 50% 100%, rgba(20, 80, 200, 0.12), transparent 70%),
          #01050e;
      }
      .grid {
        position: fixed;
        inset: -60px;
        background-image:
          linear-gradient(rgba(80, 150, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(80, 150, 255, 0.05) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(circle at 50% 46%, #000, transparent 60%);
        animation: grid 40s linear infinite;
      }

      /* frame — the same as the interface's */
      .frame {
        position: fixed;
        inset: 8px;
        border: 1px solid rgba(80, 160, 255, 0.12);
        border-radius: 14px;
        animation: fade 0.6s ease both;
      }
      .c {
        position: absolute;
        width: 34px;
        height: 34px;
        border: 2px solid var(--accent);
        filter: drop-shadow(0 0 6px var(--accent));
        opacity: 0;
        animation: corner 0.7s var(--ease) forwards 0.2s;
      }
      .tl { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; --dx: -14px; --dy: -14px; }
      .tr { top: -1px; right: -1px; border-left: 0; border-bottom: 0; border-top-right-radius: 14px; --dx: 14px; --dy: -14px; }
      .bl { bottom: -1px; left: -1px; border-right: 0; border-top: 0; border-bottom-left-radius: 14px; --dx: -14px; --dy: 14px; }
      .br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; --dx: 14px; --dy: 14px; }
      .scan {
        position: absolute;
        top: -1px;
        left: 0;
        width: 18%;
        height: 1px;
        background: linear-gradient(90deg, transparent, #bfeaff, transparent);
        filter: drop-shadow(0 0 4px var(--accent));
        animation: scan 4s ease-in-out infinite;
      }

      /* header */
      .head {
        position: fixed;
        top: 26px;
        left: 34px;
        display: flex;
        align-items: center;
        gap: 14px;
        animation: fade 0.8s ease both 0.3s;
      }
      .logo { position: relative; width: 40px; height: 40px; }
      .logo i {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--accent);
        border-right-color: transparent;
        box-shadow: 0 0 12px rgba(63, 182, 255, 0.55);
        animation: spin 1.6s linear infinite;
      }
      .logo i + i {
        inset: 9px;
        border: 0;
        background: radial-gradient(circle, #e2f6ff, var(--accent-2) 72%);
        box-shadow: 0 0 14px var(--accent);
        animation: breathe 1.6s ease-in-out infinite;
      }
      .head strong { display: block; font: 600 17px 'Orbitron', 'Segoe UI', sans-serif; letter-spacing: 0.3em; }
      .head small { font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; }
      .ver {
        position: fixed;
        top: 34px;
        right: 38px;
        font: 500 10.5px 'JetBrains Mono', monospace;
        letter-spacing: 0.2em;
        color: var(--ink-3);
        text-transform: uppercase;
        animation: fade 0.8s ease both 0.4s;
      }

      /* stage */
      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3.6vh;
        padding-top: 2vh;
      }
      .reactor { position: relative; width: min(46vmin, 420px); aspect-ratio: 1; }
      .halo {
        position: absolute;
        inset: -12%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(42, 140, 255, 0.36) 30%, transparent 68%);
        filter: blur(20px);
        opacity: 0;
        animation: fade 1.2s ease forwards 0.8s, breathe 4s ease-in-out infinite 2s;
      }
      svg.r { position: absolute; inset: 0; overflow: visible; }
      .tick { stroke: rgba(42, 140, 255, 0.4); stroke-width: 1; }
      .tick-l { stroke: var(--hi); stroke-width: 1.8; }
      .seg { fill: none; stroke: var(--hi); stroke-width: 3; stroke-linecap: round; opacity: 0.9; filter: drop-shadow(0 0 5px var(--core)); }
      .dots { fill: none; stroke: rgba(166, 228, 255, 0.6); stroke-width: 2; stroke-linecap: round; }
      .bloom { fill: none; stroke: var(--core); stroke-width: 24; opacity: 0; filter: blur(10px); animation: bloom-in 1s ease forwards 1.4s; }
      .ring {
        fill: none;
        stroke: url(#rg);
        stroke-width: 8;
        filter: drop-shadow(0 0 6px var(--hi)) drop-shadow(0 0 18px var(--core));
        stroke-dasharray: 943;
        stroke-dashoffset: 943;
        animation: draw 1.4s var(--ease) forwards 0.5s;
      }
      .hot { fill: none; stroke: #fff; stroke-width: 4.5; stroke-linecap: round; filter: drop-shadow(0 0 7px #fff) drop-shadow(0 0 14px var(--hi)); }
      .thin { fill: none; stroke: rgba(166, 228, 255, 0.35); stroke-width: 1.2; }
      .dash { fill: none; stroke: rgba(166, 228, 255, 0.22); stroke-width: 1.2; }
      .g { transform-origin: 200px 200px; opacity: 0; }
      .g-ticks { animation: in-spin 1.2s var(--ease) forwards 0.2s, spin 120s linear infinite 1.4s; }
      .g-seg { animation: in-fade 0.9s ease forwards 1s, spin 26s linear infinite; }
      .g-dots { animation: in-fade 0.9s ease forwards 1.1s, spin 40s linear infinite reverse; }
      .g-hot { animation: in-fade 0.6s ease forwards 1.8s, spin 2.2s linear infinite; }
      .g-dash { animation: in-fade 0.9s ease forwards 1.2s, spin 30s linear infinite reverse; }

      .text {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .kicker {
        font: 500 10px 'JetBrains Mono', monospace;
        letter-spacing: 0.4em;
        padding-left: 0.4em;
        color: var(--hi);
        opacity: 0;
        animation: fade 0.8s ease forwards 1.3s;
      }
      .mark {
        margin-top: 0.6vh;
        font: 600 clamp(22px, 4.2vmin, 40px) 'Orbitron', 'Segoe UI', sans-serif;
        letter-spacing: 0.14em;
        padding-left: 0.14em;
        color: #f2f9ff;
        text-shadow: 0 0 14px var(--hi), 0 0 34px var(--core);
        animation: mark 1.3s var(--ease) both 0.9s;
      }
      .step {
        margin-top: 1vh;
        max-width: 64%;
        min-height: 1.5em;
        font-size: clamp(9px, 1.3vmin, 12px);
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-2);
        opacity: 0;
        animation: fade 0.8s ease forwards 1.5s;
      }

      /* progress */
      .progress {
        width: min(46vmin, 420px);
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 14px;
        opacity: 0;
        animation: up 0.8s var(--ease) forwards 1.4s;
      }
      .bar {
        position: relative;
        height: 6px;
        border-radius: 6px;
        background: rgba(70, 140, 230, 0.16);
        overflow: hidden;
      }
      .fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        border-radius: 6px;
        background: linear-gradient(90deg, var(--accent-2), var(--accent), #dff5ff);
        box-shadow: 0 0 12px var(--accent);
      }
      .fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent) no-repeat;
        background-size: 40% 100%;
        animation: shine 1.3s linear infinite;
      }
      .pct {
        font: 500 13px 'JetBrains Mono', monospace;
        color: var(--ink);
        min-width: 3.4em;
        text-align: right;
      }

      /* boot checklist */
      .checks {
        width: min(54vmin, 500px);
        white-space: nowrap;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-radius: 10px;
        border: 1px solid var(--edge);
        background: linear-gradient(165deg, rgba(16, 38, 82, 0.55), rgba(5, 13, 32, 0.8));
        font-size: 12px;
        color: var(--ink-3);
        opacity: 0;
        animation: up 0.6s var(--ease) forwards;
        transition: color 0.4s, border-color 0.4s, box-shadow 0.4s;
      }
      .check:nth-child(1) { animation-delay: 1.6s; }
      .check:nth-child(2) { animation-delay: 1.7s; }
      .check:nth-child(3) { animation-delay: 1.8s; }
      .check:nth-child(4) { animation-delay: 1.9s; }
      .check .st {
        width: 16px;
        height: 16px;
        flex: none;
        border-radius: 50%;
        border: 2px solid rgba(63, 182, 255, 0.25);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }
      .check.on {
        color: var(--ink);
        border-color: rgba(120, 200, 255, 0.4);
        box-shadow: 0 0 14px rgba(31, 120, 255, 0.18);
      }
      .check.on .st {
        border: 0;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
        animation: pop 0.35s var(--ease);
        position: relative;
      }
      .check.on .st::after {
        content: '';
        position: absolute;
        left: 5px;
        top: 3px;
        width: 4px;
        height: 7px;
        border: solid #02121f;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
      .check b {
        margin-left: auto;
        font: 500 9.5px 'JetBrains Mono', monospace;
        letter-spacing: 0.16em;
        color: var(--ink-3);
      }
      .check.on b { color: #8ff0bd; }

      .note {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 4vh;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--ink-3);
      }
      .out { animation: out 0.7s var(--ease) forwards; }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes in-spin { from { opacity: 0; transform: rotate(-90deg) scale(0.85); } to { opacity: 1; transform: rotate(0) scale(1); } }
      @keyframes in-fade { to { opacity: 1; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes bloom-in { to { opacity: 0.3; } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes corner { from { opacity: 0; transform: translate(var(--dx), var(--dy)); } to { opacity: 0.85; transform: none; } }
      @keyframes mark { from { opacity: 0; letter-spacing: 0.6em; filter: blur(8px); } to { opacity: 1; letter-spacing: 0.14em; filter: none; } }
      @keyframes breathe { 50% { opacity: 0.6; } }
      @keyframes pop { from { transform: scale(0.4); } to { transform: none; } }
      @keyframes shine { from { background-position: -40% 0; } to { background-position: 140% 0; } }
      @keyframes scan { 0% { left: 2%; } 50% { left: 80%; } 100% { left: 2%; } }
      @keyframes grid { to { transform: translate(60px, 60px); } }
      @keyframes out { to { opacity: 0; transform: scale(1.06); filter: blur(8px); } }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="grid"></div>
    <div class="frame"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><i class="scan"></i></div>

    <header class="head">
      <div class="logo"><i></i><i></i></div>
      <div>
        <strong>J.A.R.V.I.S.</strong>
        <small>Personal AI Assistant</small>
      </div>
    </header>
    <div class="ver">System boot</div>

    <div class="stage" id="stage">
      <div class="reactor">
        <div class="halo"></div>
        <svg class="r" viewBox="0 0 400 400">
          <defs>
            <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#a6e4ff" />
              <stop offset="0.5" stop-color="#2a8cff" />
              <stop offset="1" stop-color="#1546d6" />
            </linearGradient>
            <radialGradient id="dg" cx="50%" cy="40%" r="62%">
              <stop offset="0" stop-color="#0f2f66" />
              <stop offset="0.6" stop-color="#051330" />
              <stop offset="1" stop-color="#020a1a" />
            </radialGradient>
          </defs>
          <g class="g g-ticks" id="ticks"></g>
          <g class="g g-seg"><circle cx="200" cy="200" r="176" class="seg" stroke-dasharray="120 30 20 30 70 50" /></g>
          <g class="g g-dots"><circle cx="200" cy="200" r="166" class="dots" stroke-dasharray="1.5 9" /></g>
          <circle cx="200" cy="200" r="150" class="bloom" />
          <circle cx="200" cy="200" r="128" fill="url(#dg)" />
          <circle cx="200" cy="200" r="150" class="ring" transform="rotate(-90 200 200)" />
          <g class="g g-hot"><circle cx="200" cy="200" r="150" class="hot" stroke-dasharray="70 873" /></g>
          <circle cx="200" cy="200" r="136" class="thin" />
          <g class="g g-dash"><circle cx="200" cy="200" r="120" class="dash" stroke-dasharray="30 12" /></g>
        </svg>
        <div class="text">
          <div class="kicker">INITIALIZING</div>
          <div class="mark">J.A.R.V.I.S.</div>
          <div class="step" id="step">Starting core systems</div>
        </div>
      </div>

      <div class="progress">
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="pct" id="pct">0%</div>
      </div>

      <div class="checks">
        <div class="check on" id="c-core"><span class="st"></span>Core systems<b>READY</b></div>
        <div class="check" id="c-brain"><span class="st"></span>Neural bridge<b>…</b></div>
        <div class="check" id="c-voice"><span class="st"></span>Voice systems<b>…</b></div>
        <div class="check" id="c-face"><span class="st"></span>Interface<b>…</b></div>
      </div>
    </div>
    <div class="note" id="note"></div>

    <script>
      // Tick marks around the ring.
      const ticks = document.getElementById('ticks')
      for (let i = 0; i < 90; i++) {
        const a = (i / 90) * Math.PI * 2
        const long = i % 15 === 0
        const l = document.createElementNS('http://www.w3.org/2000/svg', 'line')
        l.setAttribute('x1', 200 + Math.cos(a) * 196); l.setAttribute('y1', 200 + Math.sin(a) * 196)
        l.setAttribute('x2', 200 + Math.cos(a) * (long ? 184 : 190)); l.setAttribute('y2', 200 + Math.sin(a) * (long ? 184 : 190))
        l.setAttribute('class', long ? 'tick-l' : 'tick')
        ticks.appendChild(l)
      }

      const params = new URLSearchParams(location.search)
      // JARVIS's own port (vite.config.ts) — not 5173, which other projects use.
      const FACE = 'http://localhost:5188/'
      const target = FACE + '?from=splash' + (params.get('wake') === '1' ? '&wake=1' : '')
      const fill = document.getElementById('fill')
      const pct = document.getElementById('pct')
      const step = document.getElementById('step')
      const note = document.getElementById('note')
      const started = Date.now()

      // Reachability only: no-cors resolves for any answer at all and rejects
      // when nothing is listening yet, which is exactly the question.
      const up = (url) =>
        fetch(url, { mode: 'no-cors', cache: 'no-store' }).then(() => true, () => false)

      let brain = false
      let face = false
      let leaving = false
      let shown = 0 // the percentage on screen, eased toward the real one

      function goal() {
        const done = 1 + (brain ? 1 : 0) + (face ? 1 : 0)
        const creep = Math.min(0.14, (Date.now() - started) / 50000)
        return Math.min(100, (done / 3 + (done < 3 ? creep : 0)) * 100)
      }

      function frame() {
        const g = leaving ? 100 : goal()
        shown += (g - shown) * 0.06
        if (Math.abs(g - shown) < 0.2) shown = g
        fill.style.width = shown + '%'
        pct.textContent = Math.round(shown) + '%'
        requestAnimationFrame(frame)
      }

      function mark(id, on) {
        const el = document.getElementById(id)
        el.classList.toggle('on', on)
        el.querySelector('b').textContent = on ? 'ONLINE' : '…'
      }

      function paint() {
        mark('c-brain', brain)
        mark('c-face', face)
        mark('c-voice', brain && face)
        step.textContent = leaving
          ? 'All systems online'
          : !brain
            ? 'Connecting neural bridge'
            : !face
              ? 'Bringing the interface online'
              : 'Calibrating voice systems'
      }

      async function tick() {
        if (leaving) return
        ;[brain, face] = await Promise.all([up('http://127.0.0.1:8787/health'), up(FACE)])
        // ?preview=1 holds the screen part-way, for looking at the design.
        if (params.get('preview') === '1') [brain, face] = [true, false]
        paint()
        if (brain && face) {
          leaving = true
          paint()
          setTimeout(() => {
            document.getElementById('stage').classList.add('out')
            setTimeout(() => location.replace(target), 650)
          }, 1100)
          return
        }
        if ((Date.now() - started) / 1000 > 90) {
          note.textContent = 'Taking longer than usual — check the JARVIS brain window'
        }
        setTimeout(tick, 600)
      }

      requestAnimationFrame(frame)
      tick()
    </script>
  </body>
</html>
